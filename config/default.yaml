# AI Presenter default configuration.
# Copy to config/local.yaml (git-ignored) to override values on your machine,
# or use environment variables, e.g. AIP_VIDEO__SOURCE=file.
# Secrets (API keys, license key) never go in this file.

mode: local            # local | cloud

video:
  source: camera       # camera | file  (file = mock input for the cloud dev box)
  camera_index: 0
  file_path: null
  loop_file: true
  capture_width: 1280
  capture_height: 720
  fps: 30
  render_width: 512    # avatar is rendered at this size, then upscaled
  render_height: 768
  output_width: 1280
  output_height: 720

audio:
  source: mic          # mic | file
  input_device: null   # null = system default
  output_device: "CABLE Input"   # VB-Audio Virtual Cable
  file_path: null
  host_api: wasapi     # wasapi | asio  (never MME)
  sample_rate: 48000
  block_ms: 20

tracking:
  backend: mediapipe   # mediapipe | rtmw
  face: true
  pose: true
  hands: true
  max_hands: 2
  pose_model: full     # lite | full | heavy
  min_confidence: 0.5
  max_input_side: 960  # downscale before tracking (models run at <=256 px internally)
  mirror_input: false  # true if the camera image is already mirrored
  parallel: true       # face / pose / hands models in parallel threads
  # One Euro smoothing: lower min_cutoff = smoother, higher beta = less lag on fast moves
  smoothing:            { min_cutoff: 1.0, beta: 5.0,  d_cutoff: 1.0 }
  hand_smoothing:       { min_cutoff: 1.5, beta: 10.0, d_cutoff: 1.0 }
  blendshape_smoothing: { min_cutoff: 3.0, beta: 1.0,  d_cutoff: 1.0 }

avatar:
  renderer: debug          # debug (Phase 1 overlay) | liveportrait (Phase 3)
  character_image: null
  device: cuda
  fp16: null               # null = auto (on for RTX 20xx+)
  compile: false           # torch.compile (Linux / cloud only)
  canvas_height: 768
  pose_strength: 1.0       # 0..2, how much head movement is copied
  expression_strength: 1.0 # 0..2
  brow_raise_max: 0.015    # soft cap on brow raises (forehead wrinkles); 0 = no limit
  neutral_window_s: 5.0    # seconds to look for the calmest face as expression baseline; 0 = off
  face_sharpen: 0.8        # 0..2, sharpen the animated face (0 = off, as soft as the generator)
  stitching: true
  eye_retarget: false
  background: original     # original | color | image (image = output.background_path)
  background_color: "#00b140"
  pose_smoothing:       { min_cutoff: 1.0, beta: 0.05, d_cutoff: 1.0 }
  expression_smoothing: { min_cutoff: 2.5, beta: 2.0,  d_cutoff: 1.0 }
  lost_face_ease_s: 0.5

output:
  virtual_camera: true
  softcam_dll: null    # default: %LOCALAPPDATA%\AIPresenter\bin\softcam.dll
  preview: true        # dev preview window
  virtual_mic: true
  ai_label: true
  background_path: null

cloud:
  provider: runpod
  max_session_minutes: 35
  warn_before_stop_minutes: 5
  connection_lost_grace_seconds: 60

logging:
  level: INFO
  json_format: false
  max_file_mb: 10
  backup_count: 5
