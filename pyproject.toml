[project]
name = "ai-presenter"
version = "0.1.0"
description = "Live AI presenter: webcam + mic -> AI character video and voice for streaming."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "numpy>=1.26,<2.3",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
# Each phase adds its own group so the cloud worker and license server stay small.
# mediapipe pulls in opencv-contrib-python (Apache-2.0); adding opencv-python too would conflict.
tracking = ["mediapipe>=0.10.14"]
voice = ["sounddevice>=0.5", "onnxruntime-gpu>=1.19"]
app = ["PySide6>=6.7", "keyring>=25"]
worker = ["aiortc>=1.9"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2"]

[project.scripts]
aip = "aip.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-psutil>=7.2.2.20260906",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aip", "common", "engine", "app", "worker", "cloud", "license_server", "training"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aip", "common", "engine"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs an NVIDIA GPU (skipped in CI)",
    "slow: long-running (soak tests)",
]
addopts = "-m 'not gpu and not slow'"

[[tool.mypy.overrides]]
module = ["mediapipe.*", "cv2.*"]
ignore_missing_imports = true
